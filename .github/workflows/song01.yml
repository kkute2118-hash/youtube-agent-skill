name: Render Song 01 (free)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Image seed"
        default: "4242"
      reuse_images:
        description: "Reuse scene images from the renders branch (1 = yes)"
        default: "0"
      images_only:
        description: "Only make scene images (1 = yes)"
        default: "0"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0
      - name: Python deps
        run: pip install pillow requests numpy
      - name: Reuse previous scene images
        if: github.event.inputs.reuse_images == '1'
        run: |
          git fetch --depth 1 origin renders
          mkdir -p studio/song01/out && git archive origin/renders scenes | tar -x -C studio/song01/out
          ls studio/song01/out/scenes
      - name: Render
        env:
          SEED: ${{ github.event.inputs.seed }}
          IMAGES_ONLY: ${{ github.event.inputs.images_only }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python studio/song01/build.py
      - name: Publish to renders branch
        run: |
          mkdir /tmp/pub && (cp studio/song01/out/bunny-ki-gaadi-song01.mp4 /tmp/pub/ || true) && cp -r studio/song01/out/scenes /tmp/pub/
          cd /tmp/pub && git init -q -b renders && git add -A
          git -c user.name="render-bot" -c user.email="render-bot@users.noreply.github.com" commit -q -m "Song 01 render ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" renders
